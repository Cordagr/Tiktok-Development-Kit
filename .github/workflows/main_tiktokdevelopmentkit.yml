name: Build and deploy Gradle app to Azure Web App - TiktokDevelopmentKit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: List JARs
        run: ls -la build/libs/

      - name: Find main JAR
        id: find-jar
        run: |
          # Find the main JAR (exclude plain and sources JARs)
          MAIN_JAR=$(find build/libs -name "*.jar" ! -name "*-plain.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
          echo "main-jar=$(basename $MAIN_JAR)" >> $GITHUB_OUTPUT
          echo "Found main JAR: $MAIN_JAR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: build/libs/${{ steps.find-jar.outputs.main-jar }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ./

      - name: List downloaded files
        run: ls -la

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TiktokDevelopmentKit'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ED82EF80CFA64FF2AD43872841C6C5DC }}